<title>Tennis Court Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one narrow phone column — sticky day picker, selected-day detail, then a week grid. */
:root {
  --court: #1f5c4a;        /* hard-court green */
  --court-deep: #143d31;
  --ball: #d7ef3a;         /* optic yellow */
  --ball-ink: #26300a;
  --bg: #f3f6f2;
  --surface: #ffffff;
  --line: #dbe4dd;
  --fg: #15231d;
  --muted: #5d6f66;
  --taken: #e6ece7;
  --free: #2f8f6c;
  --free-soft: #dff1e8;
  --past: #b9c5be;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --court: #1c4d3f; --court-deep: #10261f; --ball: #d7ef3a; --ball-ink: #26300a;
    --bg: #0d1613; --surface: #15211c; --line: #24342d; --fg: #e6efe9; --muted: #92a69b;
    --taken: #1c2a24; --free: #55c49a; --free-soft: #173a2e; --past: #46564f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --court: #1c4d3f; --court-deep: #10261f; --ball: #d7ef3a; --ball-ink: #26300a;
  --bg: #0d1613; --surface: #15211c; --line: #24342d; --fg: #e6efe9; --muted: #92a69b;
  --taken: #1c2a24; --free: #55c49a; --free-soft: #173a2e; --past: #46564f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--court-deep);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header band */
header.band { background: var(--court-deep); color: #eef5f0; position: relative; overflow: hidden; }
header.band::after { /* court lines */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(70% - 1px), rgba(255,255,255,.12) calc(70% - 1px), rgba(255,255,255,.12) calc(70% + 1px), transparent calc(70% + 1px)),
    linear-gradient(0deg, transparent calc(38% - 1px), rgba(255,255,255,.12) calc(38% - 1px), rgba(255,255,255,.12) calc(38% + 1px), transparent calc(38% + 1px));
}
header.band .wrap { padding-block: 22px 18px; position: relative; z-index: 1; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ball); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; margin: 6px 0 6px; letter-spacing: .01em; text-wrap: balance; }
.sub { color: #b9cdc3; font-size: 14px; margin: 0; }

/* Sticky day picker */
.picker { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--court-deep); border-bottom: 1px solid rgba(255,255,255,.06); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-block: 10px 12px; }
.day {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  background: rgba(255,255,255,.07); color: #dbe8e1; border-radius: 12px;
  padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: background .15s, transform .15s;
}
.day:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.day .dn { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.day .dd { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.05; }
.day .dc { font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .85; }
.day.today .dn::after { content: "•"; color: var(--ball); margin-left: 2px; }
.day[aria-selected="true"] { background: var(--ball); color: var(--ball-ink); }
.day[aria-selected="true"] .dn, .day[aria-selected="true"] .dc { opacity: 1; }
.day.past { opacity: .45; }

main .wrap { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 22px; }

/* Selected-day summary */
.summary { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.summary > div:first-child { min-width: 0; }
.summary h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; }
.summary .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.big { text-align: right; }
.big b { font-family: var(--f-display); font-size: 40px; line-height: .9; color: var(--free); font-variant-numeric: tabular-nums; display: block; }
.big span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

/* Next-slot callout */
.next {
  display: flex; align-items: center; gap: 12px;
  background: var(--court); color: #eef5f0; border-radius: var(--r); padding: 12px 14px;
}
.next .ball { width: 28px; height: 28px; border-radius: 50%; flex: none; background: var(--ball);
  background-image: radial-gradient(circle at -20% 50%, transparent 58%, rgba(255,255,255,.85) 59%, rgba(255,255,255,.85) 64%, transparent 65%),
                    radial-gradient(circle at 120% 50%, transparent 58%, rgba(255,255,255,.85) 59%, rgba(255,255,255,.85) 64%, transparent 65%); }
.next .t { font-size: 13px; color: #b9d3c6; }
.next .v { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* Day timeline strip */
.strip-wrap { display: flex; flex-direction: column; gap: 6px; }
.strip { display: grid; gap: 2px; height: 26px; }
.strip i { border-radius: 4px; background: var(--taken); }
.strip i.f { background: var(--free); }
.strip i.f.p { background: var(--past); }
.strip-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Slot groups */
.group h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.slot {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
}
.slot .time { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
.slot .time small { font-size: 15px; color: var(--muted); font-weight: 500; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--free-soft); color: var(--free); white-space: nowrap; }
.slot.past { opacity: .55; }
.slot.past .pill { background: var(--taken); color: var(--muted); }
.slot.now { border-color: var(--free); box-shadow: 0 0 0 1px var(--free) inset; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 99px; padding: 9px 16px;
}
.btn:focus-visible { outline: 2px solid var(--free); outline-offset: 2px; }
.btn.ok { border-color: var(--free); color: var(--free); }

/* Week grid */
section.week h2 { font-family: var(--f-display); font-size: 22px; margin: 0 0 4px; }
section.week p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.grid { border-collapse: separate; border-spacing: 3px; padding: 8px; font-variant-numeric: tabular-nums; }
table.grid th { font-size: 11px; font-weight: 500; color: var(--muted); padding: 0 0 4px; text-align: center; }
table.grid th.rowh { text-align: left; padding: 0 8px 0 2px; white-space: nowrap; font-weight: 600; color: var(--fg); position: sticky; left: 0; background: var(--surface); }
table.grid td { width: 24px; min-width: 24px; height: 26px; border-radius: 5px; background: var(--taken); cursor: pointer; }
table.grid td.f { background: var(--free); }
table.grid td.f.p { background: var(--past); }
table.grid tr.sel th.rowh { color: var(--free); }

footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="band">
  <div class="wrap">
    <div class="eyebrow">Court availability</div>
    <h1>Tennis Court Schedule</h1>
    <p class="sub" id="range"></p>
  </div>
</header>

<nav class="picker" aria-label="Choose a day">
  <div class="wrap"><div class="days" id="days" role="tablist"></div></div>
</nav>

<main>
  <div class="wrap">
    <section id="detail" aria-live="polite"></section>

    <section class="week">
      <h2>Week at a glance</h2>
      <p>Green = free hour. Tap a row to see that day.</p>
      <div class="grid-scroll"><table class="grid" id="grid"></table></div>
    </section>

    <footer>Hours not shown are already booked. The schedule can change at any time, so check with the club committee before you come.</footer>
  </div>
</main>

<script>
(function () {
  var MONTHS = { JANUARI:0, JANUARY:0, FEBRUARI:1, FEBRUARY:1, MARET:2, MARCH:2, APRIL:3, MEI:4, MAY:4, JUNI:5, JUNE:5, JULI:6, JULY:6, AGUSTUS:7, AUGUST:7, SEPTEMBER:8, OKTOBER:9, OCTOBER:9, NOVEMBER:10, DESEMBER:11, DECEMBER:11 };
  var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var GROUPS = [
    { name: "Morning", from: 0,  to: 11 },
    { name: "Midday",  from: 11, to: 15 },
    { name: "Afternoon", from: 15, to: 18 },
    { name: "Evening", from: 18, to: 24 }
  ];

  function parse(text) {
    var days = [], cur = null;
    var dayRe = /^(SENIN|SELASA|RABU|KAMIS|JUM'?AT|SABTU|MINGGU|MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)\s*,?\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i;
    var timeRe = /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/;
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim(); if (!line) return;
      var d = line.match(dayRe);
      if (d) {
        var m = MONTHS[d[3].toUpperCase()];
        if (m === undefined) return;
        cur = { date: new Date(+d[4], m, +d[2]), slots: [] };
        days.push(cur); return;
      }
      var t = line.match(timeRe);
      if (t && cur) cur.slots.push({ start: +t[1] + +t[2] / 60, end: +t[3] + +t[4] / 60, label: pad(t[1]) + ":" + t[2], endLabel: pad(t[3]) + ":" + t[4] });
    });
    days.forEach(function (d) { d.slots.sort(function (a, b) { return a.start - b.start; }); });
    return days;
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function nowHour(now) { return now.getHours() + now.getMinutes() / 60; }
  function dayStatus(d, now) {
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (d.date < today) return "past";
    if (sameDay(d.date, now)) return "today";
    return "future";
  }
  function isPast(day, slot, now) {
    var s = dayStatus(day, now);
    return s === "past" || (s === "today" && slot.end <= nowHour(now));
  }
  function blocks(slots) { // merge consecutive slots
    var out = [];
    slots.forEach(function (s) {
      var last = out[out.length - 1];
      if (last && Math.abs(last.end - s.start) < 0.01) { last.end = s.end; last.endLabel = s.endLabel; }
      else out.push({ start: s.start, end: s.end, label: s.label, endLabel: s.endLabel });
    });
    return out;
  }
  function fmtDate(d) { return DAY_NAMES[d.getDay()] + ", " + d.getDate() + " " + MONTH_NAMES[d.getMonth()]; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  var days = parse(document.getElementById("schedule-text").textContent);
  var now = new Date();
  var sel = 0;
  days.forEach(function (d, i) { if (dayStatus(d, now) === "today") sel = i; });
  if (dayStatus(days[sel] || { date: now }, now) === "past") {
    var f = days.findIndex(function (d) { return dayStatus(d, now) !== "past"; });
    if (f >= 0) sel = f;
  }

  // hour range for strip + grid
  var minH = 6, maxH = 22;
  days.forEach(function (d) { d.slots.forEach(function (s) { minH = Math.min(minH, Math.floor(s.start)); maxH = Math.max(maxH, Math.ceil(s.end)); }); });
  var HOURS = []; for (var h = minH; h < maxH; h++) HOURS.push(h);
  function freeAt(day, h) { return day.slots.find(function (s) { return s.start <= h && s.end >= h + 1; }); }

  if (days.length) {
    var a = days[0].date, b = days[days.length - 1].date;
    document.getElementById("range").textContent =
      a.getDate() + (a.getMonth() !== b.getMonth() ? " " + MONTH_NAMES[a.getMonth()] : "") + " – " + b.getDate() + " " + MONTH_NAMES[b.getMonth()] + " " + b.getFullYear() +
      " · " + days.reduce(function (n, d) { return n + d.slots.length; }, 0) + " free hours this week";
  }

  function renderDays() {
    var box = document.getElementById("days"); box.innerHTML = "";
    days.forEach(function (d, i) {
      var st = dayStatus(d, now);
      var btn = el("button", "day" + (st === "today" ? " today" : "") + (st === "past" ? " past" : ""));
      btn.type = "button"; btn.id = "day-" + i; btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", i === sel ? "true" : "false");
      btn.setAttribute("aria-label", fmtDate(d.date) + ", " + d.slots.length + " free hours");
      btn.innerHTML = '<span class="dn">' + DAY_NAMES[d.date.getDay()].slice(0, 3) + '</span><span class="dd">' + d.date.getDate() + '</span><span class="dc">' + d.slots.length + ' hrs</span>';
      btn.onclick = function () { select(i); };
      box.appendChild(btn);
    });
  }

  function renderDetail() {
    var box = document.getElementById("detail"); box.innerHTML = "";
    var d = days[sel]; if (!d) { box.appendChild(el("div", "empty", "No schedule yet.")); return; }
    var st = dayStatus(d, now);
    var remaining = d.slots.filter(function (s) { return !isPast(d, s, now); });
    var wrap = el("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:16px";

    var sum = el("div", "summary");
    var left = el("div");
    left.appendChild(el("h2", null, fmtDate(d.date) + (st === "today" ? ' <span style="color:var(--free);font-size:18px">· Today</span>' : "")));
    var bl = blocks(d.slots).sort(function (x, y) { return (y.end - y.start) - (x.end - x.start); })[0];
    left.appendChild(el("div", "meta", bl ? "Longest block " + bl.label + "–" + bl.endLabel + " (" + (bl.end - bl.start) + " hrs)" : "No free hours"));
    sum.appendChild(left);
    var big = el("div", "big", "<b>" + (st === "today" ? remaining.length : d.slots.length) + "</b><span>" + (st === "today" ? "hours left" : "hours free") + "</span>");
    sum.appendChild(big);
    wrap.appendChild(sum);

    if (st === "today") {
      var nh = nowHour(now);
      var cur = remaining.find(function (s) { return s.start <= nh && s.end > nh; });
      var nxt = cur || remaining[0];
      var nx = el("div", "next");
      nx.appendChild(el("div", "ball"));
      var txt = el("div");
      txt.appendChild(el("div", "t", nxt ? (cur ? "Free now" : "Next free slot") : "Today"));
      txt.appendChild(el("div", "v", nxt ? nxt.label + " – " + nxt.endLabel : "All slots have passed"));
      nx.appendChild(txt);
      wrap.appendChild(nx);
    }

    // strip
    var sw = el("div", "strip-wrap");
    var strip = el("div", "strip"); strip.style.gridTemplateColumns = "repeat(" + HOURS.length + ", 1fr)";
    strip.setAttribute("aria-hidden", "true");
    HOURS.forEach(function (h) {
      var s = freeAt(d, h);
      strip.appendChild(el("i", s ? "f" + (isPast(d, s, now) ? " p" : "") : ""));
    });
    sw.appendChild(strip);
    var axis = el("div", "strip-axis");
    [minH, Math.round((minH + maxH) / 2), maxH].forEach(function (h) { axis.appendChild(el("span", null, pad(h) + ":00")); });
    sw.appendChild(axis);
    sw.appendChild(el("div", "legend",
      '<span><i style="background:var(--free)"></i>Free</span><span><i style="background:var(--taken)"></i>Booked</span>' +
      (st === "today" ? '<span><i style="background:var(--past)"></i>Passed</span>' : "")));
    wrap.appendChild(sw);

    if (!d.slots.length) {
      wrap.appendChild(el("div", "empty", "Fully booked this day."));
    } else {
      GROUPS.forEach(function (g) {
        var gs = d.slots.filter(function (s) { return s.start >= g.from && s.start < g.to; });
        if (!gs.length) return;
        var grp = el("div", "group");
        grp.appendChild(el("h3", null, "<span>" + g.name + "</span><span>" + gs.length + (gs.length === 1 ? " slot" : " slots") + "</span>"));
        var list = el("div", "slots");
        gs.forEach(function (s) {
          var past = isPast(d, s, now);
          var isNow = st === "today" && s.start <= nowHour(now) && s.end > nowHour(now);
          var c = el("div", "slot" + (past ? " past" : "") + (isNow ? " now" : ""));
          c.appendChild(el("div", "time", s.label + " <small>– " + s.endLabel + "</small>"));
          c.appendChild(el("span", "pill", past ? "Passed" : isNow ? "Now" : "Free"));
          list.appendChild(c);
        });
        grp.appendChild(list);
        wrap.appendChild(grp);
      });
    }

    var act = el("div", "actions");
    var copy = el("button", "btn", "Copy this day's schedule"); copy.type = "button"; copy.id = "copy-btn";
    copy.onclick = function () {
      var text = "Free tennis court slots — " + fmtDate(d.date) + "\n" +
        (d.slots.length ? blocks(d.slots).map(function (x) { return "• " + x.label + " – " + x.endLabel; }).join("\n") : "Fully booked");
      function done() { copy.textContent = "Copied"; copy.classList.add("ok"); setTimeout(function () { copy.textContent = "Copy this day's schedule"; copy.classList.remove("ok"); }, 1800); }
      try {
        navigator.clipboard.writeText(text).then(done, fallback);
      } catch (e) { fallback(); }
      function fallback() {
        var ta = el("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
      }
    };
    act.appendChild(copy);
    wrap.appendChild(act);

    box.appendChild(wrap);
  }

  function renderGrid() {
    var t = document.getElementById("grid"); t.innerHTML = "";
    var head = el("tr"); head.appendChild(el("th"));
    HOURS.forEach(function (h) { head.appendChild(el("th", null, pad(h))); });
    t.appendChild(head);
    days.forEach(function (d, i) {
      var tr = el("tr", i === sel ? "sel" : "");
      tr.appendChild(el("th", "rowh", DAY_NAMES[d.date.getDay()].slice(0, 3) + " " + d.date.getDate()));
      HOURS.forEach(function (h) {
        var s = freeAt(d, h);
        var td = el("td", s ? "f" + (isPast(d, s, now) ? " p" : "") : "");
        td.title = DAY_NAMES[d.date.getDay()] + " " + pad(h) + ":00 · " + (s ? "free" : "booked");
        tr.appendChild(td);
      });
      tr.onclick = function () { select(i); window.scrollTo({ top: 0, behavior: "smooth" }); };
      t.appendChild(tr);
    });
  }

  function select(i) { sel = i; renderDays(); renderDetail(); renderGrid(); }
  select(sel);
  setInterval(function () { now = new Date(); renderDays(); renderDetail(); renderGrid(); }, 5 * 60 * 1000);
})();
</script>
